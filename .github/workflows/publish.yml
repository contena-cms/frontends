name: Publish packages

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm dist-tag to publish
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish Contena packages
        run: |
          pnpm --filter @contena/api-client publish --access public --tag "${{ inputs.npm-tag }}" --no-git-checks
          pnpm --filter @contena/api-gen publish --access public --tag "${{ inputs.npm-tag }}" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
